<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Josefin+Sans:wght@400;600&display=swap"><style>body{margin:0;background:#e9e3d6;font-family:'Josefin Sans',sans-serif;color:#2b211c}a{color:#b8412a}a:hover{color:#2b211c}</style></helmet>
<div style="padding:64px;display:flex;flex-direction:column;gap:96px">
<div><h1 style="margin:0;font:400 44px 'Young Serif',serif">JabKit · desktop, tablet, mobile</h1><p style="margin:10px 0 0;font-size:17px">Vaudeville direction with Young Serif. Each frame is live: scroll inside it. Desktop 1280, tablet 820, mobile 390.</p></div>
<sc-for list="{{ pages }}" as="p" hint-placeholder-count="3">
<section id="{{ p.id }}" style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:baseline;gap:14px"><span style="font:600 14px 'Josefin Sans';padding:4px 10px;border:2px solid #2b211c;border-radius:99px;background:#f0c850">{{ p.id }}</span><h2 style="margin:0;font:400 30px 'Young Serif',serif">{{ p.name }}</h2></div>
<div style="display:flex;gap:40px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase">Desktop · 1280</span><iframe src="{{ p.src }}" loading="lazy" title="Desktop" style="width:1280px;height:860px;border:3px solid #2b211c;border-radius:10px;background:#fff;box-shadow:6px 6px 0 #2b211c"></iframe></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase">Tablet · 820</span><iframe src="{{ p.src }}" loading="lazy" title="Tablet" style="width:820px;height:1180px;border:12px solid #2b211c;border-radius:28px;background:#fff"></iframe></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase">Mobile · 390</span><iframe src="{{ p.src }}" loading="lazy" title="Mobile" style="width:390px;height:844px;border:10px solid #2b211c;border-radius:40px;background:#fff"></iframe></div>
</div></section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const P = [['1a','Home'],['1b','Components catalogue'],['1c','Component detail'],['1d','Category list'],['1e','Samples index'],['1f','Design systems index'],['1h','How it works'],['1i','Agents / MCP'],['1j','404']];
    return { pages: P.map(([id, name]) => ({ id, name, src: 'Showcase%20Mockups%20v3.dc.html?screen=' + id })) };
  }
}
</script>
</body>
</html>
