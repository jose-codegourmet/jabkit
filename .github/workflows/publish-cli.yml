name: Publish CLI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify the version is new
        run: |
          NAME=$(node -p "require('./packages/cli/package.json').name")
          VERSION=$(node -p "require('./packages/cli/package.json').version")

          if ! npm view "$NAME" name >/dev/null 2>&1; then
            echo "::error::$NAME is not on npm yet. Create the @jabkit org, run npm login, publish 0.1.0 from packages/cli on your machine, then attach a GitHub Actions trusted publisher (workflow publish-cli.yml, allow npm publish)."
            exit 1
          fi

          if npm view "$NAME@$VERSION" version 2>/dev/null | grep -q .; then
            echo "::error::$NAME@$VERSION is already on npm. Run 'pnpm release:cli patch', commit the bump to main, then dispatch this workflow again."
            exit 1
          fi

          echo "Publishing $NAME@$VERSION"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jabkit/cli typecheck
      - run: pnpm --filter @jabkit/cli build
      - run: npm publish
        working-directory: packages/cli

      - name: Confirm the registry moved the latest tag
        run: |
          NAME=$(node -p "require('./packages/cli/package.json').name")
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          LATEST=""
          for _ in $(seq 1 12); do
            LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || true)
            [ "$LATEST" = "$VERSION" ] && break
            sleep 5
          done
          {
            echo "### Published \`$NAME@$VERSION\`"
            echo ""
            echo "- registry \`latest\` is now \`$LATEST\`"
            echo "- the npmjs.com page can stay cached for up to an hour; trust \`npm view $NAME dist-tags\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LATEST" != "$VERSION" ]; then
            echo "::warning::latest is still $LATEST; registry replication may be lagging"
          fi
