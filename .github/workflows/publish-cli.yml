name: Publish CLI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - id: check
        name: Is this version already published?
        run: |
          NAME=$(node -p "require('./packages/cli/package.json').name")
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if ! npm view "$NAME" name >/dev/null 2>&1; then
            echo "::error::$NAME is not on npm yet. Create the @jabkit org, run npm login, publish 0.1.0 from packages/cli on your machine, then attach a GitHub Actions trusted publisher (workflow publish-cli.yml, allow npm publish)."
            exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "Already published: $NAME@$VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: pnpm --filter @jabkit/cli typecheck
      - if: steps.check.outputs.publish == 'true'
        run: pnpm --filter @jabkit/cli build
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
        working-directory: packages/cli
